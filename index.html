<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidless SMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
/* Layout idea: one loud moment (pixel server name + floating crown), everything after it calm. Left-aligned lists with hairline dividers, text tabs, one accent color per job. */
:root {
  --bg: #0e0a14;
  --raise: #161020;
  --line: #2a2236;
  --text: #f3eefa;
  --muted: #9d93ad;
  --purple: #b06cf5;
  --pink: #f27ab8;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  --sans: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--pink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 26px; font-weight: 650; letter-spacing: -.015em; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
.muted { color: var(--muted); }

/* ---------- Hero ---------- */
header.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line);
  background: radial-gradient(520px 360px at 82% 50%, rgba(176,108,245,.14), transparent 70%); }
#void { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .wrap { position: relative; display: grid; grid-template-columns: 1fr 220px; align-items: center; gap: 48px; padding-top: 96px; padding-bottom: 96px; }
.hero-copy { display: grid; gap: 20px; justify-items: start; }
.season { font-size: 13px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; }
.hero h1 { font-family: var(--pixel); font-weight: 700; font-size: clamp(48px, 8.5vw, 96px); line-height: .95; letter-spacing: .01em; }
.lead { color: var(--muted); font-size: 18px; max-width: 46ch; }
.ip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.ip { display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); }
.ip code { font-family: var(--pixel); font-size: 20px; }
.btn { border: 1px solid transparent; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; transition: background .15s, border-color .15s; }
.btn.primary { background: var(--purple); color: #fff; }
.btn.primary:hover { background: #9d55e8; }
.btn.ghost { border-color: var(--line); color: var(--text); background: transparent; padding: 12px 18px; }
.btn.ghost:hover { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.crown-stage { display: grid; place-items: center; }
#crown { width: 100%; image-rendering: pixelated; filter: drop-shadow(0 10px 20px rgba(176,108,245,.3)); animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
.facts { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 14px; color: var(--muted); }
.facts b { color: var(--text); font-weight: 600; }

/* ---------- Tabs ---------- */
.tabbar { position: sticky; top: 0; z-index: 20; background: rgba(14,10,20,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.tabbar .wrap { display: flex; align-items: center; gap: 24px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--pixel); font-size: 18px; color: var(--text); text-decoration: none; flex-shrink: 0; }
.brand canvas { width: 22px; image-rendering: pixelated; }
.tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; margin-left: auto; height: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: flex; align-items: center; height: 100%; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--pink); }
@media (max-width: 720px) { .brand span { display: none; } }

/* ---------- Views ---------- */
main.wrap { padding-top: 64px; padding-bottom: 112px; min-height: 60vh; }
.view { display: none; }
.view.on { display: block; }
.head { display: grid; gap: 8px; margin-bottom: 32px; }
.head p { color: var(--muted); max-width: 62ch; }
.empty { color: var(--muted); font-size: 15px; padding: 20px 0; }
.example { font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); padding: 1px 8px; border-radius: 99px; margin-left: 6px; }

/* List rows: news, events, rules */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li, .rows > article { display: grid; grid-template-columns: 120px 1fr; gap: 4px 28px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.rows > li:first-child, .rows > article:first-child { padding-top: 0; }
.rows > li:last-child, .rows > article:last-child { border-bottom: 0; }
.rows .side-l { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.rows .body { display: grid; gap: 6px; max-width: 64ch; }
.rows .body p { color: var(--muted); white-space: pre-line; }
.pin { color: var(--pink); font-size: 13px; font-weight: 600; }
.home { display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; align-items: start; }
.home .rows > li, .home .rows > article { grid-template-columns: 1fr; }
.home section + section { margin-top: 0; }
.rules-list .side-l { font-family: var(--pixel); font-size: 20px; color: var(--muted); line-height: 1.2; }
.rules-list > li { grid-template-columns: 56px 1fr; }
.callout { margin-top: 24px; color: var(--muted); font-size: 15px; }

/* Features */
.features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px 56px; }
.feature { display: grid; grid-template-columns: 52px 1fr; gap: 4px 18px; align-content: start; }
.feature > :not(.icon) { grid-column: 2; }
.icon { grid-row: 1 / span 4; width: 52px; height: 52px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); display: grid; place-items: center; }
.icon canvas { width: 32px; image-rendering: pixelated; }
.feature .tag { font-size: 13px; color: var(--muted); font-weight: 500; }
.feature p { color: var(--muted); font-size: 15px; }
.cmd { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--text); background: var(--raise); padding: 2px 8px; border-radius: 6px; width: fit-content; margin-top: 6px; }

/* Tourney */
.board { overflow-x: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 520px; }
th, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { padding-left: 0; }
th { font-size: 13px; color: var(--muted); font-weight: 500; }
td.rank { font-family: var(--pixel); font-size: 20px; color: var(--muted); width: 52px; }
tr.r1 td.rank { color: var(--pink); }
tr.r2 td.rank, tr.r3 td.rank { color: var(--purple); }
.who { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.who img { width: 28px; border-radius: 5px; image-rendering: pixelated; }
.bar { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.bar i { display: block; height: 4px; width: 80px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--purple); }
.note { font-size: 14px; color: var(--muted); margin-top: 16px; max-width: 64ch; }

/* Tierlist */
.tl-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
.seg { display: flex; gap: 6px; overflow-x: auto; }
.seg button { background: none; border: 1px solid var(--line); padding: 6px 14px; border-radius: 99px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }
.search { margin-left: auto; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; }
.search input { background: none; border: 0; color: var(--text); font: inherit; font-size: 14px; padding: 8px 0; width: 180px; outline: none; }
.search:focus-within { border-color: var(--purple); }
.tiers { display: grid; gap: 8px; }
.tier { display: grid; grid-template-columns: 76px 1fr; min-height: 68px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.tier-label { display: grid; place-items: center; align-content: center; gap: 2px; background: color-mix(in srgb, var(--tc) 16%, transparent); border-right: 2px solid var(--tc); color: var(--tc); padding: 6px; text-align: center; }
.tier-label b { font-family: var(--pixel); font-size: 30px; line-height: 1; }
.tier-label span { font-size: 11px; font-weight: 500; color: var(--muted); }
.tier-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; align-content: center; }
.pc { display: flex; align-items: center; gap: 9px; padding: 5px 12px 5px 5px; border-radius: 8px; background: var(--raise); transition: opacity .15s, box-shadow .15s; }
.pc img { width: 30px; border-radius: 5px; image-rendering: pixelated; }
.pc b { display: block; font-size: 14px; font-weight: 600; line-height: 1.2; }
.pc span { font-size: 12px; color: var(--muted); }
.pc.dim { opacity: .25; }
.pc.hit { box-shadow: inset 0 0 0 1px var(--pink); }
.tier-row .empty { padding: 0 4px; font-size: 14px; }
.legend { display: grid; gap: 8px 24px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 24px; }
.legend div { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--muted); }
.legend b { font-family: var(--pixel); font-size: 17px; color: var(--tc); min-width: 16px; }

/* Staff */
.staff { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.member { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
.member img { width: 48px; border-radius: 8px; image-rendering: pixelated; }
.member b { display: block; font-weight: 600; }
.role { font-size: 14px; color: var(--rc); }

/* Join */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; gap: 6px; align-content: start; padding-top: 16px; border-top: 1px solid var(--line); }
.steps li::before { content: counter(s); font-family: var(--pixel); font-size: 22px; color: var(--muted); line-height: 1; margin-bottom: 6px; }
.steps p { color: var(--muted); font-size: 15px; }
.cta { margin-top: 56px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center; padding-top: 32px; border-top: 1px solid var(--line); }
.cta h3 { font-size: 22px; }

footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px); opacity: 0; background: var(--raise); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; transition: .2s; pointer-events: none; font-size: 14px; z-index: 80; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: 1fr; padding-top: 56px; padding-bottom: 64px; }
  .crown-stage { width: 140px; order: -1; justify-self: start; }
  .home { grid-template-columns: 1fr; gap: 48px; }
  .features { grid-template-columns: 1fr; gap: 32px; }
}
@media (max-width: 560px) {
  .rows > li, .rows > article { grid-template-columns: 1fr; }
  .rules-list > li { grid-template-columns: 40px 1fr; }
  .tier { grid-template-columns: 64px 1fr; } .tier-label b { font-size: 26px; }
  .search { margin-left: 0; width: 100%; } .search input { width: 100%; }
}

/* ---------- Dev panel ---------- */
.dev-fab { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: none; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); font-weight: 600; font-size: 14px; }
.dev-fab.on { display: inline-flex; }
.dev-fab:hover { border-color: var(--muted); }
.dev-fab i { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); display: none; }
.dev-fab.dirty i { display: block; }
.dev { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 70; background: #120d19; border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; transform: translateX(105%); transition: transform .25s ease; }
.dev.open { transform: none; }
.dv-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.dv-top h2 { font-size: 18px; display: flex; align-items: baseline; gap: 10px; }
.dv-top h2 small { font-size: 13px; font-weight: 500; color: var(--muted); }
.dv-x { background: none; border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; font-size: 18px; line-height: 1; }
.dv-x:hover { border-color: var(--muted); }
.dv-nav { display: flex; gap: 4px; overflow-x: auto; padding: 10px 14px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.dv-nav button { flex-shrink: 0; background: none; border: 0; border-radius: 6px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.dv-nav button:hover { color: var(--text); }
.dv-nav button[aria-pressed="true"] { color: var(--text); background: var(--raise); }
.dv-body { overflow-y: auto; padding: 18px 18px 28px; display: grid; gap: 14px; align-content: start; }
.dv-body h3 { font-size: 14px; font-weight: 600; margin: 10px 0 -4px; }
.dv-hint { font-size: 13px; color: var(--muted); }
.dv-f { display: grid; gap: 5px; }
.dv-f > label, .dv-lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
.dv-f input[type=text], .dv-f input[type=number], .dv-f input[type=date], .dv-f textarea, .dv-f select, .dv-in {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; color: var(--text); font: inherit; font-size: 14px; padding: 8px 10px; }
.dv-f textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
.dv-f input:focus, .dv-f textarea:focus, .dv-f select:focus, .dv-in:focus { outline: none; border-color: var(--purple); }
.dv-f input[type=color] { width: 52px; height: 34px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
.dv-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.dv-check input { width: 16px; height: 16px; accent-color: var(--purple); }
.dv-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dv-4 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; }
.dv-item { border: 1px solid var(--line); border-radius: 10px; }
.dv-item > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 9px 9px 12px; cursor: pointer; }
.dv-item > summary::-webkit-details-marker { display: none; }
.dv-item > summary b { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dv-item > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.dv-item[open] > summary::before { transform: rotate(90deg); }
.dv-item .dv-fields { display: grid; gap: 10px; padding: 2px 12px 14px; }
.dv-tools { display: flex; gap: 4px; }
.dv-tools button { background: none; border: 1px solid var(--line); border-radius: 6px; width: 27px; height: 27px; font-size: 12px; line-height: 1; color: var(--muted); }
.dv-tools button:hover { color: var(--text); border-color: var(--muted); }
.dv-tools button:disabled { opacity: .35; cursor: default; }
.dv-tools button.del:hover { color: #fb7185; border-color: #fb7185; }
.dv-add { background: none; border: 1px dashed var(--line); border-radius: 10px; padding: 9px; font-size: 14px; color: var(--muted); width: 100%; }
.dv-add:hover { color: var(--text); border-color: var(--muted); }
.dv-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dv-row .dv-in { flex: 1; min-width: 120px; width: auto; }
.dv-sbtn { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; font-size: 13px; }
.dv-sbtn:hover { border-color: var(--muted); }
.dv-sbtn.danger:hover { border-color: #fb7185; color: #fb7185; }
.dv-tier { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
.dv-tier > span { display: grid; place-items: center; height: 40px; border-radius: 8px; background: var(--tc); color: #120c18; font-family: var(--pixel); font-size: 20px; }
.dv-json { font-family: ui-monospace, Consolas, monospace !important; font-size: 12px !important; min-height: 380px !important; }
.dv-foot { border-top: 1px solid var(--line); padding: 14px 18px; display: grid; gap: 10px; }
.dv-status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.dv-status.warn { color: var(--pink); }
.dv-status.err { color: #fb7185; }
.dv-actions { display: flex; gap: 10px; justify-content: flex-end; }
.dv-actions .btn.ghost { padding: 9px 16px; }
@media (min-width: 1100px) { body.dev-open .wrap { margin-left: 0; margin-right: 460px; } }
</style>
</head>

  gem: ["...LLPPP...","..LWLPPPP..",".LWPPPPPPP.","PPPPPPPPPPD",".PPPPPPPPD.","..PPPPPPD..","...PPPPD...","....PPD....",".....D....."],

function sprite(canvas, rows) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  canvas.width = w; canvas.height = h;
  const x = canvas.getContext("2d");
  rows.forEach((r, y) => [...r].forEach((ch, i) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, y, 1, 1); } }));
}
const headCache = {};
function head(name, color = "#b06cf5") {
  const key = name + color; if (headCache[key]) return headCache[key];
  const c = document.createElement("canvas"); c.width = c.height = 8;
  const x = c.getContext("2d");
  let h = 2166136261; for (const ch of String(name)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => (h = (Math.imul(h, 1103515245) + 12345) >>> 0) / 4294967296;
  const hue = 250 + Math.floor(rnd() * 90);
  x.fillStyle = `hsl(${hue} 25% 16%)`; x.fillRect(0, 0, 8, 8);
  for (let py = 0; py < 8; py++) for (let px = 0; px < 4; px++) {
    const r = rnd();
    if (r < .58) { x.fillStyle = r < .1 ? "#f3eefa" : (r < .36 ? color : `hsl(${hue} 50% 55%)`); x.fillRect(px, py, 1, 1); x.fillRect(7 - px, py, 1, 1); }
  }
  x.fillStyle = "#f3eefa"; x.fillRect(1, 3, 2, 1); x.fillRect(5, 3, 2, 1);
  x.fillStyle = "#120c18"; x.fillRect(2, 3, 1, 1); x.fillRect(5, 3, 1, 1); x.fillRect(3, 5, 2, 1);
  return headCache[key] = c.toDataURL();
}

(() => {
  const cv = $("#void"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dots = [];
  const cols = ["176,108,245", "242,122,184", "243,238,250"];
  const size = () => {
    w = cv.width = cv.offsetWidth; h = cv.height = cv.offsetHeight;
    dots = Array.from({ length: Math.round(w * h / 26000) }, () => ({
      x: Math.random() * w, y: Math.random() * h, s: Math.random() < .3 ? 3 : 2,
      v: .06 + Math.random() * .16, c: cols[Math.floor(Math.random() * cols.length)], a: .12 + Math.random() * .3
    }));
  };
  const draw = () => {
    ctx.clearRect(0, 0, w, h);
    for (const p of dots) {
      ctx.fillStyle = `rgba(${p.c},${p.a})`;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
      if (!still) { p.y -= p.v; if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; } }
    }
    if (!still) requestAnimationFrame(draw);
  };
  addEventListener("resize", () => { size(); if (still) draw(); });
  size(); draw();
})();

  const attrs = `id="${id}" data-scope="${esc(scope)}" data-i="${i ?? ""}" data-k="${esc(key)}"`;
  const v = obj?.[key];
  if (type === "checkbox") return `<label class="dv-check" for="${id}"><input type="checkbox" ${attrs} ${v ? "checked" : ""}>${esc(label)}</label>`;
  let input;
  if (type === "textarea") input = `<textarea ${attrs} rows="3">${esc(v)}</textarea>`;
  else if (type === "select") input = `<select ${attrs}>${opts.map(o => `<option value="${esc(o)}" ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (type === "color") input = `<input type="color" ${attrs} value="${safeColor(v)}">`;
  else input = `<input type="${type}" ${attrs} value="${esc(v)}">`;
  return `<div class="dv-f"><label for="${id}">${esc(label)}</label>${input}</div>`;
}
function listEditor(path) {
  const sch = SCHEMAS[path], arr = getPath(draft, path) || [];
  return `<div class="dv-list" data-path="${path}" style="display:grid;gap:10px">` + arr.map((it, i) => {
    const key = path + ":" + i;
    const fields = sch.compact
      ? `<div class="dv-4">${sch.fields.map(f => field(path, i, f, it)).join("")}</div>`
      : sch.fields.map(f => field(path, i, f, it)).join("");
    return `<details class="dv-item" data-key="${esc(key)}" ${openItems.has(key) ? "open" : ""}>
      <summary><b data-title>${esc(it[sch.title] || "(untitled)")}</b>
        <span class="dv-tools">
          <button type="button" data-act="up" data-i="${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button>
          <button type="button" data-act="down" data-i="${i}" aria-label="Move down" ${i === arr.length - 1 ? "disabled" : ""}>↓</button>
          <button type="button" class="del" data-act="del" data-i="${i}" aria-label="Delete">✕</button>
        </span></summary>
      <div class="dv-fields">${fields}</div></details>`;
  }).join("") + `<button type="button" class="dv-add" data-act="add">+ Add ${sch.one}</button></div>`;
}

function sectionHTML() {
  fid = 0;
  switch (section) {
    case "general": return `<p class="dv-hint">Basic server info shown at the top of every page.</p>` +
      [["name", "Server name", "text"], ["tagline", "Tagline", "textarea"], ["ip", "Server IP", "text"], ["version", "Version", "text"], ["season", "Season badge", "text"], ["discord", "Discord invite link", "text"]]
        .map(f => field("", null, f, draft)).join("");
    case "news": return `<p class="dv-hint">Pinned posts show first. Newest posts come next.</p>` + listEditor("news");
    case "events": return listEditor("events");
    case "rules": return `<p class="dv-hint">Rules are numbered in this order.</p>` + listEditor("rules");
    case "features": return listEditor("features");
    case "staff": return listEditor("staff");
    case "join": return listEditor("join");
    case "tourney": return `<p class="dv-hint">The table sorts by Elo on its own. The "Updated" date changes to today when you save new numbers.</p>
      <div class="dv-2">${field("leaderboard", null, ["updated", "Updated", "date"], draft.leaderboard)}<div class="dv-f" style="align-content:end">${field("leaderboard", null, ["example", "Show \"Example data\" label", "checkbox"], draft.leaderboard)}</div></div>
      <h3>Players</h3>` + listEditor("leaderboard.players");
    case "tierlist": {
      const cats = draft.tierlist.categories;
      const names = Object.keys(cats);
      if (!names.includes(devCat)) devCat = names[0] || null;
      const c = cats[devCat] || {};
      return `<div class="dv-2">${field("tierlist", null, ["updated", "Updated", "date"], draft.tierlist)}<div class="dv-f" style="align-content:end">${field("tierlist", null, ["example", "Show \"Example data\" label", "checkbox"], draft.tierlist)}</div></div>
        <h3>Categories</h3>
        <div class="dv-row"><label class="dv-lbl" for="dv-cat">Editing</label>
          <select class="dv-in" id="dv-cat">${names.map(n => `<option ${n === devCat ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
          <button type="button" class="dv-sbtn danger" data-act="cat-del" ${!devCat ? "disabled" : ""}>Delete</button></div>
        <div class="dv-row"><input class="dv-in" id="dv-cat-name" type="text" placeholder="Category name, e.g. Pot"><button type="button" class="dv-sbtn" data-act="cat-add">Add</button><button type="button" class="dv-sbtn" data-act="cat-rename" ${!devCat ? "disabled" : ""}>Rename current</button></div>
        <h3>Players in ${esc(devCat || "—")}</h3>
        <p class="dv-hint">One player name per line. Players in the Tourney leaderboard show their Elo here too.</p>
        ${devCat ? draft.tierlist.tiers.map(t => `<div class="dv-tier" style="--tc:${safeColor(t.color)}"><span>${esc(t.id)}</span>
          <div class="dv-f"><textarea id="dv-tier-${esc(t.id)}" data-tier="${esc(t.id)}" rows="2" aria-label="${esc(t.id)} tier players" placeholder="Nobody yet">${esc((c[t.id] || []).join("\n"))}</textarea></div></div>`).join("") : '<p class="dv-hint">Add a category to start.</p>'}
        <h3>Tiers</h3>` + listEditor("tierlist.tiers");
    }
    case "json": return `<p class="dv-hint">Everything on the site as JSON. Edit and press Apply to preview.</p>
      <div class="dv-f"><textarea class="dv-json" id="dv-json" spellcheck="false" aria-label="Site data as JSON">${esc(JSON.stringify(draft, null, 2))}</textarea></div>
      <div class="dv-row"><button type="button" class="dv-sbtn" data-act="json-apply">Apply JSON</button></div>`;
  }
}
function renderPanel() {
  $("#dv-nav").innerHTML = SECTIONS.map(([k, l]) => `<button type="button" data-sec="${k}" aria-pressed="${k === section}">${l}</button>`).join("");
  $("#dv-body").innerHTML = sectionHTML();
  updateStatus();
}

const isDirty = () => JSON.stringify(draft) !== SAVED_JSON;
function updateStatus(msg, kind) {
  const el = $("#dv-status"), dirty = isDirty();
  $("#dev-fab").classList.toggle("dirty", dirty);
  $("#dv-save").disabled = !dirty; $("#dv-discard").disabled = !dirty;
  el.className = "dv-status" + (kind ? " " + kind : (dirty ? " warn" : ""));
  el.textContent = msg || (dirty
    ? (artifactApi ? "Unsaved changes. Players still see the old version." : "Unsaved changes. Download the updated file, then upload it to your host.")
    : (artifactApi ? "Everything is saved and live." : "No changes yet. Edit anything on the left to preview it."));
}
let pv;
function preview() { clearTimeout(pv); pv = setTimeout(() => { S = draft; render(S); updateStatus(); }, 120); }

function openDev(open) {
  $("#dev").classList.toggle("open", open);
  $("#dev").setAttribute("aria-hidden", String(!open));
  $("#dev-fab").setAttribute("aria-expanded", String(open));
  document.body.classList.toggle("dev-open", open);
  if (open) { renderPanel(); S = draft; render(S); $("#dv-close").focus(); }
}
$("#dev-fab").addEventListener("click", () => openDev(!$("#dev").classList.contains("open")));
$("#dv-close").addEventListener("click", () => openDev(false));
addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#dev").classList.contains("open")) openDev(false); });

$("#dv-nav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-sec]"); if (!b) return;
  section = b.dataset.sec; renderPanel();
  if (SEC_VIEW[section] && location.hash.slice(1) !== SEC_VIEW[section]) location.hash = SEC_VIEW[section];
});
$("#dv-body").addEventListener("toggle", (e) => {
  const d = e.target.closest?.(".dv-item"); if (!d) return;
  d.open ? openItems.add(d.dataset.key) : openItems.delete(d.dataset.key);
}, true);

$("#dv-body").addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "dv-json" || t.id === "dv-cat-name") return;
  if (t.dataset.tier) {
    draft.tierlist.categories[devCat][t.dataset.tier] = t.value.split(/\n|,/).map(s => s.trim()).filter(Boolean);
    return preview();
  }
  if (t.dataset.k == null) return;
  const scope = t.dataset.scope, i = t.dataset.i, k = t.dataset.k;
  const base = getPath(draft, scope);
  const obj = i === "" ? base : base[+i];
  let v = t.type === "checkbox" ? t.checked : t.type === "number" ? (t.value === "" ? 0 : +t.value) : t.value;
  if (scope === "tierlist.tiers" && k === "id") {
    v = v.trim();
    const old = obj.id;
    if (old !== v) for (const c of Object.values(draft.tierlist.categories)) { if (c[old]) { c[v] = c[old]; delete c[old]; } }
  }
  obj[k] = v;
  const sch = SCHEMAS[scope];
  if (sch && sch.title === k) { const b = t.closest(".dv-item")?.querySelector("[data-title]"); if (b) b.textContent = v || "(untitled)"; }
  preview();
});
$("#dv-body").addEventListener("change", (e) => {
  if (e.target.id === "dv-cat") { devCat = e.target.value; renderPanel(); tlCat = devCat; render(S); }
  if (e.target.dataset.scope === "tierlist.tiers" && e.target.dataset.k === "id") renderPanel();
});

$("#dv-body").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  e.preventDefault();
  const act = b.dataset.act;
  const list = b.closest(".dv-list");
  if (list) {
    const path = list.dataset.path, arr = getPath(draft, path), i = +b.dataset.i;
    if (act === "add") { arr.push(SCHEMAS[path].blank()); openItems.add(path + ":" + (arr.length - 1)); }
    if (act === "del") {
      if (path === "tierlist.tiers") for (const c of Object.values(draft.tierlist.categories)) delete c[arr[i].id];
      arr.splice(i, 1);
    }
    if (act === "up" && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    if (act === "down" && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    if (act !== "add") openItems.clear();
    renderPanel(); preview();
    return;
  }
  const cats = draft.tierlist.categories;
  const nameIn = $("#dv-cat-name");
  const nm = nameIn ? nameIn.value.trim() : "";
  if (act === "cat-add") {
    if (!nm) return updateStatus("Type a category name first.", "err");
    if (cats[nm]) return updateStatus(`"${nm}" already exists.`, "err");
    cats[nm] = Object.fromEntries(draft.tierlist.tiers.map(t => [t.id, []]));
    devCat = tlCat = nm; renderPanel(); preview();
  }
  if (act === "cat-rename") {
    if (!nm) return updateStatus("Type the new name first.", "err");
    if (cats[nm]) return updateStatus(`"${nm}" already exists.`, "err");
    draft.tierlist.categories = Object.fromEntries(Object.entries(cats).map(([k, v]) => [k === devCat ? nm : k, v]));
    devCat = tlCat = nm; renderPanel(); preview();
  }
  if (act === "cat-del") {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Click again to delete"; return; }
    delete cats[devCat]; devCat = null; renderPanel(); preview();
  }
  if (act === "json-apply") {
    try {
      const parsed = JSON.parse($("#dv-json").value);
      if (typeof parsed !== "object" || !parsed || Array.isArray(parsed)) throw new Error("Top level must be an object.");
      draft = parsed; openItems.clear(); renderPanel(); preview();
      updateStatus("JSON applied. Check the preview, then save.");
    } catch (err) { updateStatus("JSON error: " + err.message, "err"); }
  }
});

$("#dv-discard").addEventListener("click", (e) => {
  const b = e.currentTarget;
  if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Click again to discard"; setTimeout(() => { b.dataset.confirm = ""; b.textContent = "Discard changes"; }, 3000); return; }
  b.dataset.confirm = ""; b.textContent = "Discard changes";
  draft = JSON.parse(SAVED_JSON); S = draft; openItems.clear(); renderPanel(); render(S);
});

function buildDoc(data) {
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  const json = JSON.stringify(data, null, 2).replace(/</g, "\\u003c");
  const end = "</" + "script>";
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
    "<title>" + esc(data.name || "SMP") + "</title>\n" +
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
    "<link href=\"https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n" +
    "<style id=\"css\">" + css + "</style>\n</head>\n<body>\n<div id=\"root\"></div>\n" +
    "<script id=\"smp-data\" type=\"application/json\">\n" + json + "\n" + end + "\n" +
    "<script id=\"app\">" + app + end + "\n</body>\n</html>\n";
}

function downloadDoc() {
  const blob = new Blob([buildDoc(draft)], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  updateStatus("Downloaded index.html. Upload it to your host to replace the old file, and players will see the changes.");
}

$("#dv-save").addEventListener("click", async () => {
  if (!isDirty()) return;
  if (!artifactApi) return downloadDoc();
  const saved = JSON.parse(SAVED_JSON);
  if (draft.leaderboard && JSON.stringify(draft.leaderboard.players) !== JSON.stringify(saved.leaderboard?.players) && draft.leaderboard.updated === saved.leaderboard?.updated) draft.leaderboard.updated = today();
  if (draft.tierlist && JSON.stringify([draft.tierlist.categories, draft.tierlist.tiers]) !== JSON.stringify([saved.tierlist?.categories, saved.tierlist?.tiers]) && draft.tierlist.updated === saved.tierlist?.updated) draft.tierlist.updated = today();
  const btn = $("#dv-save"); btn.disabled = true; btn.textContent = "Publishing…";
  updateStatus("Publishing your changes…");
  try {
    await artifactApi.publish(buildDoc(draft));
    updateStatus("Published. The page is reloading with your changes.");
  } catch (err) {
    const code = String(err?.code || err?.message || err);
    btn.textContent = "Save & publish"; btn.disabled = false;
    if (/not_writer|not_granted/.test(code)) updateStatus("Only the owner can publish changes to this site.", "err");
    else if (/conflict/.test(code)) updateStatus("Someone else saved first. The page will reload to their version.", "err");
    else updateStatus("Couldn't publish: " + code, "err");
  }
});
addEventListener("beforeunload", (e) => { if (artifactApi && isDirty()) { e.preventDefault(); e.returnValue = ""; } });

/* Light up the dev panel only where this page can publish itself */
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(api => {
    if (!api) return;
    artifactApi = api;
    $("#dev-fab").classList.add("on");
    updateStatus();
  }).catch(() => {});
} else {
  /* Hosted outside claude.ai: open the editor by adding #dev to the URL.
     Edits stay in your browser until you download the file and re-upload it. */
  const enableHosted = () => {
    if (location.hash !== "#dev") return;
    $("#dev-fab").classList.add("on");
    $("#dv-save").textContent = "Download updated site";
    $(".dv-top small").textContent = "Download & re-upload";
    openDev(true);
    history.replaceState(null, "", location.pathname + location.search + "#home"); route();
  };
  enableHosted();
  addEventListener("hashchange", enableHosted);
}
})();
</script>
</body>
</html>
